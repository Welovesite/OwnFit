<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in | OwnFit</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#D7192A">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="OwnFit home"><span class="own">OWN</span><span class="fit">FIT</span></a>
    <div class="top-actions">
      <a class="btn btn-line btn-sm" href="index.html">Website</a>
      <button type="button" class="btn btn-red btn-sm" id="logout" hidden>Log out</button>
    </div>
  </div>
</header>
<main class="wrap portal">
  <div class="auth-box" id="auth-box">
    <div>
      <h1>My account</h1>
      <p class="muted">Clients see their sessions. Coaches see their clients.</p>
    </div>
    <button type="button" class="btn btn-google btn-block" id="google"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 38.2 44 33 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</button>
    <div class="or">or with email</div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-in" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="tab-up" aria-selected="false">Create account</button>
    </div>
    <form id="form-in" class="stack" novalidate>
      <div class="field"><label for="in-email">Email</label><input id="in-email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="in-pass">Password</label><input id="in-pass" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-red btn-block" type="submit">Sign in</button>
      <button type="button" class="link" id="forgot">Forgot your password?</button>
    </form>
    <form id="form-up" class="stack" novalidate hidden>
      <div class="field"><label for="up-name">Full name</label><input id="up-name" autocomplete="name" required maxlength="80"></div>
      <div class="field"><label for="up-phone">Mobile number</label><input id="up-phone" type="tel" dir="ltr" autocomplete="tel" placeholder="+971 5X XXX XXXX" maxlength="30"></div>
      <div class="field"><label for="up-email">Email</label><input id="up-email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="up-pass">Password</label><input id="up-pass" type="password" autocomplete="new-password" minlength="8" required></div>
      <p class="small muted">At least 8 characters.</p>
      <button class="btn btn-red btn-block" type="submit">Create account</button>
    </form>
    <p class="err" id="err" hidden></p>
    <p class="ok" id="ok" hidden></p>
  </div>
  <p class="muted" id="busy" hidden><span class="spinner"></span> Signing you in…</p>
</main>
<script type="module" src="js/login.js"></script>
<div class="toast" id="toast" hidden role="status"></div>
<script src="js/track.js" defer></script>
</body>
</html>
